<head>

  <style>
    :root {
      --bg: #fcfcfc; --fg: #0d0d0d; --muted: #525252; --muted-2: #8c8c8c;
      --border: #e8e8e8; --border-strong: #d4d4d4; --surface: #f9f9f9;
      --radius: 6px; --radius-btn: 6px; --radius-sm: 6px;
      --card-shadow: 0 1px 3px rgba(0,0,0,.08);
      --maxw: 980px; --nav-h: 64px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--fg); font-size: 16px; line-height: 1.625; letter-spacing: -0.015em; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

    /* NAV */
    .site-nav { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .site-nav-inner { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; height: var(--nav-h); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .nav-brand { font-size: .875rem; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; transition: opacity .2s ease-out; }
    .nav-brand:hover { opacity: .55; }
    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-link { font-size: .875rem; font-weight: 500; color: var(--muted); padding: 5px 9px; border-radius: 6px; white-space: nowrap; transition: color .15s; }
    .nav-link:hover { color: var(--fg); }
    .nav-link.current { color: var(--fg); font-weight: 600; }
    .nav-all { font-size: .875rem; font-weight: 500; padding: 5px 11px; border: 1px solid var(--fg); border-radius: 6px; margin-left: 4px; white-space: nowrap; background: var(--fg); color: var(--bg); transition: transform .2s ease-out; }
    .nav-all:hover { transform: translateX(2px); }
    

    /* PAGE HEADER */
    .page-header { padding: 96px 0 72px; }
    .page-header h1 { font-size: clamp(2.4rem, 5.5vw, 3.6rem); font-weight: 600; letter-spacing: -.045em; margin: 0 0 8px; line-height: 1.02; }
    .page-header p { font-size: 1rem; color: var(--muted); margin: 0; }

    /* PROJECTS GRID — 3 col desktop, 2 col tablet, 1 col mobile */
    .all-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 80px 24px;
      padding: 96px 0 120px;
    }

    /* PROJECT CARD */
    .p-card {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      transition: transform .2s ease-out;
    }
    .p-card:hover { transform: translateY(-3px); }
    .p-card.hidden { display: none; }

    .p-cover {
      aspect-ratio: 1/1;
      background: repeating-linear-gradient(-45deg, #f4f4f5, #f4f4f5 12px, #efeff1 12px, #efeff1 24px);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .p-cover::after { content:"↗"; position:absolute; top:14px; right:16px; font-size:.75rem; color:var(--fg); opacity:0; transition:opacity .15s; }
    .p-card:hover .p-cover::after { opacity:.5; }

    .p-body { padding: 18px 0 0; flex: 1; display: flex; flex-direction: column; }
    .p-title { font-size: 1rem; font-weight: 600; letter-spacing: -.02em; margin: 0 0 6px; line-height: 1.3; }
    .p-desc { font-size: .875rem; color: var(--muted); margin: 0 0 10px; flex: 1; line-height: 1.55; letter-spacing: -0.01em; }
    .p-date { font-size: .75rem; color: var(--muted-2); }

    /* COMING SOON card style */
    .p-card.placeholder { opacity: .5; pointer-events: none; }
    .p-card.placeholder .p-cover { background: #f4f4f5; }
    .p-card.placeholder .p-title { color: var(--muted); }

    /* EMPTY STATE */
    .empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--muted-2); font-size: .875rem; }

    /* FLOATING BAR */
    .float-bar { position: fixed; bottom: max(28px, calc(14px + env(safe-area-inset-bottom))); left: 50%; transform: translateX(-50%); z-index: 200; display: flex; align-items: center; gap: 10px; animation: floatBarIn .45s cubic-bezier(.25,.46,.45,.94) .06s both; }
    .float-group { display: flex; align-items: center; gap: 2px; background: #f0f0f0; border-radius: 100px; padding: 4px; }
    .float-back { width: 40px; height: 40px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; color: #8c8c8c; flex-shrink: 0; cursor: pointer; transition: background .15s, color .15s; animation: floatBackIn .5s cubic-bezier(.34,1.56,.64,1) .1s both; }
    .float-back:hover { background: #e6e6e6; color: #333; }
    .float-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #8c8c8c; transition: color .15s, background .15s; }
    .float-icon:hover { color: #333; background: rgba(0,0,0,.07); }
    .float-icon svg { transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
    .float-icon:hover svg { transform: scale(1.15); }
    .float-pill { display: inline-flex; align-items: center; height: 36px; padding: 0 16px; background: #222; color: #f5f5f5; border-radius: 100px; font-size: .875rem; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; margin-left: 2px; transition: background .15s, transform .2s ease-out; }
    .float-pill:hover { background: #111; transform: translateY(-2px); }
    @keyframes floatBackIn { from { opacity: 0; transform: translateX(-10px) scale(.82); } to { opacity: 1; transform: translateX(0) scale(1); } }
    @keyframes floatBarIn { from { opacity: 0; transform: translateX(-50%) translateY(14px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* FOOTER */
    footer { padding: 32px 0 max(96px, calc(80px + env(safe-area-inset-bottom))); }
    .footer-text { font-size: .75rem; color: var(--muted); margin: 0; }

    @media (max-width: 860px) { .all-grid { grid-template-columns: repeat(2, 1fr); gap: 64px 20px; } }
    @media (max-width: 520px)  { .all-grid { grid-template-columns: 1fr; gap: 48px; } }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
  </style>
</head>
